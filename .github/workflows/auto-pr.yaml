name: Auto PR Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Create PR via GitHub API
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          # Check if a PR already exists
          EXISTING=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "dev" \
            --base "main" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists. Skipping."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head dev \
              --base main \
              --title "Auto PR: dev → main" \
              --body "This PR was automatically created from dev branch." \
              --reviewer "Lokesh-Gopinath,moganth"
            echo "PR created successfully."
          fi
