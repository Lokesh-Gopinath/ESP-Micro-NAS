name: Auto PR Dev to Main

on:
  push:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REPO_TOKEN }}
          base: main
          branch: dev
          title: "Auto PR: dev → main"
          body: |
            This PR was automatically created from dev branch.
          reviewers: |
            Lokesh-Gopinath
            moganth